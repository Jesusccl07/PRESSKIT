name: Actualizar redes (TikTok e Instagram)

# Cada 3 horas mira si hay vídeos nuevos en TikTok, refresca las cifras de TikTok e Instagram y actualiza la web.
# También se puede lanzar a mano: pestaña Actions -> "Actualizar redes (TikTok e Instagram)" -> Run workflow.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Guardar aunque no haya vídeos nuevos"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tiktok
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      max-parallel: 1
      matrix:
        include:
          - site: "."
            tiktok: djclement07
            instagram: jesusccl_
          - site: djbota
            tiktok: d.j.bota
            instagram: d.j.bota
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install --upgrade "yt-dlp[default,curl-cffi]" pillow

      - name: Leer TikTok
        env:
          FORCE: ${{ inputs.force && '1' || '' }}
          SITE_DIR: ${{ matrix.site == '.' && '' || matrix.site }}
          TIKTOK_HANDLE: ${{ matrix.tiktok }}
          INSTAGRAM_HANDLE: ${{ matrix.instagram }}
        run: python scripts/update_tiktok.py

      - name: Guardar cambios
        run: |
          DATA_DIR="${{ matrix.site }}/data"
          DATA_DIR="${DATA_DIR#./}"
          if [ -n "$(git status --porcelain "$DATA_DIR")" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git pull --rebase --autostash
            git add "$DATA_DIR"
            git commit -m "Actualizar últimos TikToks (${{ matrix.site }})"
            git push
          else
            echo "Sin cambios"
          fi
