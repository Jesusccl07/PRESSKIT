name: Actualizar TikTok

# Cada 3 horas mira si hay vídeos nuevos en TikTok y actualiza la web.
# También se puede lanzar a mano desde la pestaña Actions -> "Actualizar TikTok" -> Run workflow.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tiktok
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install --upgrade "yt-dlp[default,curl-cffi]" pillow

      - name: Leer TikTok
        run: python scripts/update_tiktok.py

      - name: Guardar cambios
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "Actualizar últimos TikToks"
            git push
          else
            echo "Sin cambios"
          fi
