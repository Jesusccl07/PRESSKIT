<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DJ BOTA · Press Kit</title>
  <meta name="description" content="Press kit oficial de DJ BOTA: más de 30 años de experiencia como DJ en bodas, cumpleaños, graduaciones y fiestas privadas. Equipo Denon DJ Prime 4+ y equipo de sonido propio. Fotos, logos y contacto.">
  <meta name="theme-color" content="#080605">
  <meta name="color-scheme" content="dark">
  <link rel="canonical" href="https://jesusccl07.github.io/PRESSKIT/djbota/">
  <link rel="alternate" hreflang="es" href="https://jesusccl07.github.io/PRESSKIT/djbota/?lang=es">
  <link rel="alternate" hreflang="en" href="https://jesusccl07.github.io/PRESSKIT/djbota/?lang=en">
  <link rel="alternate" hreflang="x-default" href="https://jesusccl07.github.io/PRESSKIT/djbota/">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://jesusccl07.github.io/PRESSKIT/djbota/">
  <meta property="og:title" content="DJ BOTA · Press Kit">
  <meta property="og:description" content="Más de 30 años como DJ en bodas, cumpleaños, graduaciones y fiestas privadas.">
  <meta property="og:image" content="https://jesusccl07.github.io/PRESSKIT/djbota/assets/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="es_ES">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://jesusccl07.github.io/PRESSKIT/djbota/assets/og.jpg">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "DJ BOTA",
    "jobTitle": "DJ",
    "description": "DJ con más de 30 años de experiencia en bodas, cumpleaños, graduaciones y fiestas privadas.",
    "url": "https://jesusccl07.github.io/PRESSKIT/djbota/",
    "image": "https://jesusccl07.github.io/PRESSKIT/djbota/assets/og.jpg",
    "email": "mailto:d.j.botadj@gmail.com",
    "telephone": "+34615156526",
    "sameAs": ["https://www.tiktok.com/@d.j.bota", "https://www.instagram.com/d.j.bota/"]
  }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Manrope:wght@400;500;600;700;800&display=swap">
  <link rel="preload" as="image" href="assets/photos/bota-brazos-cruzados.webp" fetchpriority="high">
  <link rel="stylesheet" href="styles.css?v=1">
  <script>
    document.documentElement.classList.add("js");
    // Red de seguridad: si algo no carga, se quita la intro a los 6 s
    setTimeout(function () {
      var i = document.getElementById("intro");
      if (i && !window.__introDone) { i.remove(); document.body.classList.remove("is-loading"); }
    }, 6000);
  </script>
</head>
<body class="is-loading">

  <!-- INTRO: el disco arranca, baja la aguja y suena -->
  <div class="intro" id="intro" aria-hidden="true">
    <svg class="tonearm" id="tonearm" viewBox="0 0 200 420" aria-hidden="true">
      <circle cx="150" cy="40" r="30" class="ta-base"/><circle cx="150" cy="40" r="11" class="ta-pivot"/>
      <path d="M150 40 L150 250 Q150 300 110 340 L88 362" class="ta-arm"/>
      <rect x="64" y="350" width="40" height="26" rx="4" transform="rotate(-40 84 363)" class="ta-head"/>
      <rect x="138" y="2" width="24" height="22" rx="4" class="ta-weight"/>
    </svg>
    <div class="intro-waves" id="introWaves"><i></i><i></i><i></i></div>
  </div>

  <a class="skip" href="#about" data-i18n="ui.skip">Saltar al contenido</a>

  <header class="nav" id="nav">
    <a href="#top" class="nav-logo" id="navLogo" aria-label="DJ BOTA"></a>
    <nav class="nav-links" id="navLinks" aria-label="Secciones">
      <a href="#about" data-i18n="nav.about"></a>
      <a href="#events" data-i18n="nav.events"></a>
      <a href="#photos" data-i18n="nav.photos"></a>
      <a href="#social" data-i18n="nav.social"></a>
      <a href="#rider" data-i18n="nav.rider"></a>
      <a href="#booking" class="nav-cta" data-i18n="nav.booking"></a>
      <div class="menu-social" id="menuSocial"></div>
    </nav>
    <button class="lang" id="langBtn" type="button"><span data-l="es">ES</span><span data-l="en">EN</span></button>
    <button class="nav-toggle" id="navToggle" type="button" aria-label="Menú" aria-expanded="false" aria-controls="navLinks"><i></i><i></i></button>
  </header>

  <main id="top">
    <!-- PORTADA: tú con luz cálida de estudio + un vinilo girando -->
    <section class="hero" id="hero">
      <div class="hero-glow" aria-hidden="true"></div>
      <div class="hero-photo" id="heroPhoto"><img src="assets/photos/bota-brazos-cruzados.webp" alt="" fetchpriority="high"></div>
      <div class="record" id="record" aria-hidden="true">
        <div class="record-disc"></div>
        <div class="record-spin" id="recordSpin">
          <svg class="record-ring" viewBox="0 0 200 200"><defs><path id="ringPath" d="M100 100 m-74 0 a74 74 0 1 1 148 0 a74 74 0 1 1 -148 0"/></defs><text><textPath href="#ringPath" id="ringText"></textPath></text></svg>
          <div class="record-label"><img id="labelLogo" alt=""><span class="record-hole"></span></div>
        </div>
        <div class="record-sheen"></div>
      </div>
      <canvas class="hero-dust" id="heroDust" aria-hidden="true"></canvas>
      <div class="hero-copy" id="heroCopy">
        <h1 class="hero-logo"><img id="heroLogo" alt="DJ BOTA"></h1>
        <p class="hero-tagline" id="tagline"></p>
        <p class="hero-years" id="heroYears"></p>
        <div class="hero-actions" id="heroActions"></div>
      </div>
    </section>

    <!-- 30 AÑOS -->
    <section class="years" id="years">
      <div class="years-num" aria-hidden="true"><span id="yearsNum">30</span><b>+</b></div>
      <div class="years-copy">
        <h2 class="years-label" id="yearsLabel"></h2>
        <p class="years-text" id="statementText"></p>
      </div>
    </section>

    <!-- SOBRE MÍ -->
    <section class="about section" id="about">
      <div class="about-grid">
        <figure class="about-photo" id="aboutPhoto"></figure>
        <div class="about-body">
          <h2 class="h2"><span data-i18n="about.title"></span><i class="wipe"></i></h2>
          <div class="about-text" id="aboutText"></div>
          <dl class="about-facts" id="aboutFacts"></dl>
        </div>
      </div>
    </section>

    <!-- EVENTOS: cada tipo de evento es un canal de la mesa -->
    <section class="events section" id="events">
      <div class="section-head">
        <h2 class="h2"><span data-i18n="events.title"></span><i class="wipe"></i></h2>
        <p class="section-sub" data-i18n="events.sub"></p>
      </div>
      <div class="mixer" id="mixer"></div>
      <p class="venues-line" id="venuesLine"></p>
    </section>

    <!-- FOTOS -->
    <section class="photos section" id="photos">
      <div class="section-head">
        <h2 class="h2"><span data-i18n="photos.title"></span><i class="wipe"></i></h2>
        <p class="section-sub" data-i18n="photos.sub"></p>
      </div>
      <div class="gallery" id="gallery"></div>
      <div class="downloads" id="downloads"></div>
    </section>

    <!-- REDES -->
    <section class="social section" id="social">
      <div class="social-grid">
        <div class="social-info">
          <h2 class="h2"><span data-i18n="social.title"></span><i class="wipe"></i></h2>
          <p class="section-sub" data-i18n="social.sub"></p>
          <dl class="social-stats" id="socialStats"></dl>
          <div class="social-actions" id="socialActions"></div>
        </div>
        <div class="phones-wrap">
          <div class="phones" id="phones"></div>
          <p class="swipe-hint"><span data-i18n="ui.swipe"></span> <i>→</i></p>
        </div>
      </div>
    </section>

    <!-- EQUIPO -->
    <section class="rider section" id="rider">
      <div class="section-head">
        <h2 class="h2"><span data-i18n="rider.title"></span><i class="wipe"></i></h2>
      </div>
      <div class="rider-grid">
        <figure class="prime" id="prime" aria-hidden="true"></figure>
        <div class="rider-list" id="riderList"></div>
      </div>
    </section>

    <!-- BOOKING -->
    <section class="booking section" id="booking">
      <div class="booking-grid">
        <div>
          <h2 class="h2"><span data-i18n="booking.title"></span><i class="wipe"></i></h2>
          <p class="section-sub" data-i18n="booking.text"></p>
          <ul class="contact-list" id="contactList"></ul>
        </div>
        <form class="booking-form" id="bookingForm" novalidate>
          <label><span data-i18n="form.name"></span><input name="nombre" autocomplete="name" required></label>
          <label><span data-i18n="form.type"></span><select name="tipo" id="typeSelect"></select></label>
          <label><span data-i18n="form.date"></span><input name="fecha" type="date"></label>
          <label><span data-i18n="form.place"></span><input name="lugar" autocomplete="address-level2"></label>
          <label><span data-i18n="form.guests"></span><input name="invitados" inputmode="numeric"></label>
          <label><span data-i18n="form.sound"></span><select name="sonido" id="soundSelect"></select></label>
          <label class="full"><span data-i18n="form.message"></span><textarea name="mensaje" rows="4"></textarea></label>
          <p class="form-error full" id="formError" role="alert"></p>
          <div class="form-actions full" id="formActions"></div>
        </form>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-logo" id="footerLogo" aria-hidden="true"></div>
    <div class="footer-social" id="footerSocial"></div>
    <p class="footer-legal">© <span id="year"></span> DJ BOTA. <span data-i18n="footer.rights"></span> <a href="#top" data-i18n="footer.top"></a></p>
  </footer>

  <div class="dock" id="dock">
    <button class="sound-btn" id="soundBtn" type="button" aria-pressed="false"><span class="sound-disc" aria-hidden="true"></span><span id="soundLabel">Play</span></button>
    <a class="dock-wa" id="dockWa" target="_blank" rel="noopener" aria-label="WhatsApp" hidden></a>
    <a class="btn btn-primary dock-cta" id="dockCta" href="#booking" data-i18n="hero.book"></a>
  </div>

  <div class="lightbox" id="lightbox" aria-hidden="true" role="dialog" aria-label="Foto">
    <img alt="">
    <button class="lb-close" type="button" aria-label="Cerrar">×</button>
    <button class="lb-nav lb-prev" type="button" aria-label="Anterior">‹</button>
    <button class="lb-nav lb-next" type="button" aria-label="Siguiente">›</button>
    <div class="lb-bar"><span class="lb-count"></span><a class="lb-download" download data-i18n="photos.download"></a></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js" defer></script>
  <script src="config.js?v=1" defer></script>
  <script src="js/sound.js?v=1" defer></script>
  <script src="js/main.js?v=1" defer></script>
</body>
</html>
