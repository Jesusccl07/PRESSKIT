<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CLEMENT · DJ Press Kit</title>
  <meta name="description" content="Press kit oficial de CLEMENT, DJ de urbano, dembow y trap desde Ciudad Real: bio, fotos de prensa, logos, rider técnico y booking.">
  <meta name="theme-color" content="#03060C">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://jesusccl07.github.io/PRESSKIT/">
  <meta property="og:title" content="CLEMENT · DJ Press Kit">
  <meta property="og:description" content="DJ de urbano, dembow y trap desde Ciudad Real. +300 eventos. Bio, fotos, logos, rider y booking.">
  <meta property="og:image" content="https://jesusccl07.github.io/PRESSKIT/assets/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://jesusccl07.github.io/PRESSKIT/assets/og.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <!-- Fuente sin bloquear la carga de la página -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&display=swap"></noscript>
  <link rel="preload" as="image" href="assets/logo.webp">
  <link rel="preload" as="image" href="assets/photos/clement-gafas.webp">
  <link rel="stylesheet" href="styles.css">
  <script>
    document.documentElement.classList.add("js");
    // Red de seguridad: si algo no carga, se quita la intro a los 7 s
    setTimeout(function () {
      var i = document.getElementById("intro");
      if (i && !window.__introDone) { i.remove(); document.body.classList.remove("is-loading"); }
    }, 7000);
  </script>
</head>
<body class="is-loading">
  <!-- Filtro "líquido" para las fotos al pasar el ratón -->
  <svg class="defs" width="0" height="0" aria-hidden="true" focusable="false">
    <filter id="liquid" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence id="liquidNoise" type="fractalNoise" baseFrequency="0.006 0.012" numOctaves="2" seed="4" result="noise"/>
      <feDisplacementMap id="liquidMap" in="SourceGraphic" in2="noise" scale="0" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>

  <!-- Intro: el logo se forma con cristales de hielo -->
  <div class="intro" id="intro" aria-hidden="true">
    <div class="intro-shards" id="introShards"></div>
    <svg class="intro-cracks" id="introCracks" preserveAspectRatio="none"></svg>
    <div class="intro-flash" id="introFlash"></div>
    <p class="intro-count"><span id="introCount">0</span>%</p>
  </div>

  <div class="cursor" id="cursor" aria-hidden="true"><span class="cursor-label" id="cursorLabel"></span></div>
  <div class="grain" aria-hidden="true"></div>

  <header class="nav" id="nav">
    <a href="#top" class="nav-logo" id="navLogo" aria-label="CLEMENT"></a>
    <nav class="nav-links" id="navLinks">
      <a href="#bio" data-i18n="nav.bio"></a>
      <a href="#photos" data-i18n="nav.photos"></a>
      <a href="#music" data-i18n="nav.music"></a>
      <a href="#venues" data-i18n="nav.venues"></a>
      <a href="#rider" data-i18n="nav.rider"></a>
      <a href="#booking" class="nav-cta" data-i18n="nav.booking"></a>
    </nav>
    <button class="lang" id="langBtn" type="button"><span data-l="es">ES</span><span data-l="en">EN</span></button>
    <button class="nav-toggle" id="navToggle" type="button" aria-label="Menú" aria-expanded="false"><span></span><span></span></button>
  </header>

  <main id="top">
    <section class="hero" id="hero">
      <div class="hero-bg" aria-hidden="true"></div>
      <div class="hero-neon" id="heroNeon" aria-hidden="true"><i></i></div>
      <div class="hero-person" id="heroPerson"></div>
      <h1 class="hero-logo" id="heroLogo">
        <canvas id="iceCanvas" aria-hidden="true"></canvas>
        <img id="logoFallback" alt="CLEMENT">
      </h1>
      <svg class="hero-cracks" id="heroCracks" preserveAspectRatio="none" aria-hidden="true"></svg>
      <div class="hero-foot" id="heroFoot">
        <p class="hero-tagline" id="tagline"></p>
        <div class="hero-actions" id="heroActions"></div>
      </div>
      <div class="hero-scroll" aria-hidden="true"><span></span></div>
    </section>

    <section class="statement" id="statement">
      <p class="statement-text" id="statementText"></p>
      <div class="stats" id="stats"></div>
    </section>

    <section class="banner" id="banner" hidden>
      <div class="banner-img" id="bannerImg"></div>
    </section>

    <section class="section bio" id="bio">
      <h2 class="h2" data-i18n="bio.title"></h2>
      <div class="bio-grid">
        <figure class="bio-photo liquid" id="bioPhoto"></figure>
        <div class="bio-text" id="bioText"></div>
      </div>
    </section>

    <section class="photos" id="photos">
      <div class="photos-inner">
        <div class="photos-head">
          <h2 class="h2" data-i18n="photos.title"></h2>
          <p data-i18n="photos.sub"></p>
        </div>
        <div class="hscroll" id="hscroll"><div class="track" id="track"></div></div>
      </div>
    </section>

    <section class="section music" id="music">
      <h2 class="h2" data-i18n="music.title"></h2>
      <div class="music-grid" id="musicGrid"></div>
    </section>

    <section class="section venues" id="venues">
      <h2 class="h2" data-i18n="venues.title"></h2>
      <ul class="venue-list" id="venueList"></ul>
    </section>

    <section class="section rider" id="rider">
      <h2 class="h2" data-i18n="rider.title"></h2>
      <ul class="rider-list" id="riderList"></ul>
    </section>

    <section class="section booking" id="booking">
      <div class="booking-head">
        <div class="neon-sign" id="neonSign">BOOKING OPEN</div>
        <h2 class="h2" data-i18n="booking.title"></h2>
        <p class="booking-lead" data-i18n="booking.text"></p>
      </div>
      <div class="booking-grid">
        <form class="booking-form" id="bookingForm" novalidate>
          <label><span data-i18n="form.name"></span><input name="nombre" required autocomplete="name"></label>
          <label><span data-i18n="form.event"></span><input name="evento" required></label>
          <label><span data-i18n="form.city"></span><input name="ciudad" autocomplete="address-level2"></label>
          <label><span data-i18n="form.date"></span><input name="fecha" type="date"></label>
          <label class="full"><span data-i18n="form.message"></span><textarea name="mensaje" rows="4"></textarea></label>
          <div class="form-actions full" id="formActions"></div>
          <p class="form-error full" id="formError" role="alert"></p>
        </form>
        <ul class="contact-list" id="contactList"></ul>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-logo" id="footerLogo" aria-hidden="true"></div>
    <div class="footer-row">
      <div class="footer-social" id="footerSocial"></div>
      <p class="footer-copy">© <span id="year"></span> CLEMENT. <span data-i18n="footer.rights"></span></p>
      <a href="#top" class="footer-top" data-i18n="footer.top"></a>
    </div>
  </footer>

  <button class="sound-btn" id="soundBtn" type="button" aria-pressed="false" data-cursor="">
    <span class="sound-vinyl" aria-hidden="true"></span>
    <span class="sound-label" id="soundLabel">Play</span>
    <span class="sound-bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
  </button>

  <div class="lightbox" id="lightbox" aria-hidden="true" role="dialog">
    <button class="lb-close" type="button" aria-label="Cerrar">×</button>
    <button class="lb-nav lb-prev" type="button" aria-label="Anterior">‹</button>
    <img alt="">
    <button class="lb-nav lb-next" type="button" aria-label="Siguiente">›</button>
    <div class="lb-bar"><span class="lb-count"></span><a class="btn btn-primary lb-download" download data-i18n="photos.download"></a></div>
  </div>

  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/lenis@1.3.4/dist/lenis.min.js"></script>
  <script defer src="config.js"></script>
  <script defer src="js/sound.js"></script>
  <script defer src="js/ice.js"></script>
  <script defer src="js/main.js"></script>
</body>
</html>
